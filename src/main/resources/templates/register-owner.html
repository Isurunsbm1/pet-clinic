<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head('Pet owner sign up')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-4">
    <div class="form-card">
        <h1 class="h3 mb-1">Create a pet owner account</h1>
        <p class="mb-4">It takes a minute, and you can start asking clinics questions straight away.</p>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/register/owner}" th:object="${form}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="fullName" class="form-label">Full name</label>
                    <input type="text" id="fullName" class="form-control" th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" autocomplete="name">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Error</div>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Contact number</label>
                    <input type="tel" id="phone" class="form-control" th:field="*{phone}" placeholder="07X XXX XXXX"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" autocomplete="tel">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Error</div>
                </div>
                <div class="col-12">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" id="email" class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" autocomplete="email">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
                </div>
                <div class="col-md-8">
                    <label for="address" class="form-label">Address <span class="text-muted fw-normal">(optional)</span></label>
                    <input type="text" id="address" class="form-control" th:field="*{address}" autocomplete="street-address">
                </div>
                <div class="col-md-4">
                    <label for="city" class="form-label">City <span class="text-muted fw-normal">(optional)</span></label>
                    <input type="text" id="city" class="form-control" th:field="*{city}" placeholder="e.g. Colombo">
                </div>
                <div class="col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</div>
                </div>
                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label">Confirm password</label>
                    <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" autocomplete="new-password">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Error</div>
                </div>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
                <button type="submit" class="btn btn-green btn-lg">Create account</button>
                <span>Already registered? <a href="/login">Log in</a></span>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
