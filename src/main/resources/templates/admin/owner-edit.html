<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head('Edit pet owner')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-5">
    <ul th:replace="~{fragments/layout :: adminTabs('owners')}"></ul>

    <div class="form-card">
        <h1 class="h3 mb-1">Edit pet owner</h1>
        <p class="mb-4">The email address is the owner's login and can't be changed here.</p>

        <form th:action="@{/admin/owners/{id}/edit(id=${ownerId})}" th:object="${form}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="fullName" class="form-label">Full name</label>
                    <input type="text" id="fullName" class="form-control" th:field="*{fullName}" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Contact number</label>
                    <input type="tel" id="phone" class="form-control" th:field="*{phone}">
                </div>
                <div class="col-md-8">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" id="address" class="form-control" th:field="*{address}">
                </div>
                <div class="col-md-4">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" class="form-control" th:field="*{city}">
                </div>
            </div>
            <div class="d-flex flex-wrap gap-3 mt-4">
                <button type="submit" class="btn btn-green btn-lg">Save changes</button>
                <a href="/admin/owners" class="btn btn-outline-green btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
