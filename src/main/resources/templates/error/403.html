<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Access denied')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-5">
    <div class="empty-state" style="max-width:560px;margin:2rem auto;">
        <i class="bi bi-shield-lock"></i>
        <h1 class="h3 mt-2">You don't have access to this page</h1>
        <p class="mb-4">This page is for a different type of account. Head back to your own dashboard or the home page.</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a href="/" class="btn btn-green">Go to home page</a>
            <a sec:authorize="!isAuthenticated()" href="/login" class="btn btn-outline-green">Log in</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
