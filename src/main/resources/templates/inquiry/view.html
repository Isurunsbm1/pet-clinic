<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head(title=${inquiry.title})}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-5">
    <a href="/inquiries" class="d-inline-block mb-3"><i class="bi bi-arrow-left me-1"></i>Back to all questions</a>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="row g-4">
        <!-- ============ Question + replies ============ -->
        <div class="col-lg-8">
            <div class="card-plain p-4 mb-4">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                    <h1 class="h3 mb-0" th:text="${inquiry.title}">Question title</h1>
                    <span th:replace="~{fragments/layout :: inquiryStatusBadge(${inquiry.status})}"></span>
                </div>
                <p class="mb-0" style="white-space:pre-line;" th:text="${inquiry.description}">Description</p>
            </div>

            <h2 class="h5 mb-3" th:text="${#lists.size(inquiry.comments) == 1 ? '1 reply' : #lists.size(inquiry.comments) + ' replies'}">Replies</h2>

            <div th:if="${!#lists.isEmpty(inquiry.comments)}">
                <div class="d-flex gap-3 mb-3" th:each="c : ${inquiry.comments}">
                    <div class="avatar-circle" th:classappend="${c.author.role.name() == 'CLINIC'} ? 'clinic' : 'owner'"
                         th:text="${#strings.toUpperCase(#strings.substring(c.author.fullName, 0, 1))}">A</div>
                    <div class="comment-bubble flex-grow-1" th:classappend="${c.author.role.name() == 'CLINIC'} ? 'clinic' : 'owner'">
                        <div class="d-flex flex-wrap justify-content-between gap-2 mb-1">
                            <div>
                                <span class="comment-author" th:text="${c.author.fullName}">Author</span>
                                <span class="comment-role ms-2" th:text="${c.author.role.name() == 'CLINIC'} ? 'Veterinary clinic' : 'Pet owner'">Role</span>
                            </div>
                            <span class="comment-role" th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy, HH:mm')}">Date</span>
                        </div>
                        <p class="mb-0" style="white-space:pre-line;" th:text="${c.content}">Reply</p>
                    </div>
                </div>
            </div>

            <div class="empty-state mb-4" th:if="${#lists.isEmpty(inquiry.comments)}">
                <i class="bi bi-hourglass-split"></i>
                <p class="mb-0 mt-2">No replies yet. Registered clinics will respond here.</p>
            </div>

            <!-- Clinic reply form -->
            <div class="card-plain p-4 mt-4" sec:authorize="hasRole('CLINIC')">
                <h2 class="h5 mb-3">Reply as a clinic</h2>
                <form th:action="@{/inquiries/{id}/comment(id=${inquiry.id})}" method="post">
                    <textarea name="content" class="form-control mb-3" rows="4" required maxlength="2000"
                              placeholder="Share your advice. If the situation sounds urgent, say so and suggest they visit a clinic."></textarea>
                    <button type="submit" class="btn btn-green"><i class="bi bi-send me-1"></i>Post reply</button>
                </form>
            </div>

            <!-- Pet owner follow-up form (only on their own question) -->
            <div class="card-plain p-4 mt-4" sec:authorize="hasRole('PET_OWNER')" th:if="${inquiry.petOwner.user.email == #authentication.name}">
                <h2 class="h5 mb-3">Add a follow-up</h2>
                <form th:action="@{/inquiries/{id}/comment(id=${inquiry.id})}" method="post">
                    <textarea name="content" class="form-control mb-3" rows="3" required maxlength="2000"
                              placeholder="Thank the clinic, or add more details about how your pet is doing."></textarea>
                    <button type="submit" class="btn btn-brand"><i class="bi bi-send me-1"></i>Post follow-up</button>
                </form>
            </div>
        </div>

        <!-- ============ Sidebar ============ -->
        <div class="col-lg-4">
            <div class="card-plain p-4">
                <h2 class="h6 mb-3">Details</h2>
                <dl class="detail-list mb-0">
                    <dt>Topic</dt>
                    <dd><span th:replace="~{fragments/layout :: categoryBadge(${inquiry.category})}"></span></dd>

                    <dt>Pet</dt>
                    <dd>
                        <span th:text="${#strings.isEmpty(inquiry.petName)} ? 'Not given' : ${inquiry.petName}">Name</span>
                        <span th:if="${!#strings.isEmpty(inquiry.petType)}" th:text="' (' + ${inquiry.petType} + ')'"></span>
                    </dd>

                    <dt>Pet's age</dt>
                    <dd th:text="${#strings.isEmpty(inquiry.petAge)} ? 'Not given' : ${inquiry.petAge}">Age</dd>

                    <dt>Asked by</dt>
                    <dd>
                        <span th:text="${inquiry.petOwner.user.fullName}">Owner</span>
                        <div class="small text-muted" th:if="${!#strings.isEmpty(inquiry.petOwner.city)}" th:text="${inquiry.petOwner.city}">City</div>
                    </dd>

                    <dt>Posted</dt>
                    <dd th:text="${#temporals.format(inquiry.createdAt, 'dd MMM yyyy, HH:mm')}">Date</dd>
                </dl>
                <hr>
                <!-- Served by the raw HttpServlet (InquirySummaryServlet) -->
                <a th:href="@{'/servlet/inquiry-summary/' + ${inquiry.id}}" class="btn btn-outline-green w-100">
                    <i class="bi bi-download me-1"></i>Download summary (.txt)
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
