<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Ask a question')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-5">
    <div class="form-card">
        <h1 class="h3 mb-1">Ask the clinics a question</h1>
        <p class="mb-4">The more detail you give, the more useful the reply. For an emergency, call your nearest clinic straight away rather than waiting for an answer here.</p>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/inquiries/new}" th:object="${form}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-md-8">
                    <label for="title" class="form-label">Question title</label>
                    <input type="text" id="title" class="form-control" th:field="*{title}" maxlength="200"
                           placeholder="e.g. When should my puppy get its second vaccine?"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error</div>
                </div>
                <div class="col-md-4">
                    <label for="category" class="form-label">Topic</label>
                    <select id="category" class="form-select" th:field="*{category}"
                            th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                        <option value="">Choose a topic</option>
                        <option th:each="c : ${categories}" th:value="${c}"
                                th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(c,'_',' ')))}">Topic</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Error</div>
                </div>

                <div class="col-md-4">
                    <label for="petName" class="form-label">Pet's name <span class="text-muted fw-normal">(optional)</span></label>
                    <input type="text" id="petName" class="form-control" th:field="*{petName}">
                </div>
                <div class="col-md-4">
                    <label for="petType" class="form-label">Type of pet</label>
                    <select id="petType" class="form-select" th:field="*{petType}">
                        <option value="">Select</option>
                        <option value="Dog">Dog</option>
                        <option value="Cat">Cat</option>
                        <option value="Bird">Bird</option>
                        <option value="Rabbit">Rabbit</option>
                        <option value="Fish">Fish</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="petAge" class="form-label">Age <span class="text-muted fw-normal">(optional)</span></label>
                    <input type="text" id="petAge" class="form-control" th:field="*{petAge}" placeholder="e.g. 8 months">
                </div>

                <div class="col-12">
                    <label for="description" class="form-label">What's happening?</label>
                    <textarea id="description" class="form-control" rows="6" maxlength="3000" th:field="*{description}"
                              placeholder="Describe the symptoms, how long they've lasted, what your pet has been eating, and any medication or vaccines given so far."
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</div>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-3 mt-4">
                <button type="submit" class="btn btn-brand btn-lg">Post question</button>
                <a href="/owner/dashboard" class="btn btn-outline-green btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
